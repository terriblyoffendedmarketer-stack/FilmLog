<div id="status-control" class="detail-status-control">
  {% if not current_rewatch %}
  <button
    class="status-btn{% if current_status == 'watchlist' %} active-watchlist{% endif %}"
    hx-post="/films/{{ tmdb_id }}/status"
    hx-vals='{"status": "watchlist"}'
    hx-target="#status-control"
    hx-swap="outerHTML">Watchlist</button>
  {% endif %}

  <button
    class="status-btn{% if current_status == 'watched' or current_rewatch %} active-watched{% endif %}"
    hx-post="/films/{{ tmdb_id }}/status"
    hx-vals='{"status": "watched"}'
    hx-target="#status-control"
    hx-swap="outerHTML">Watched</button>

  <button
    class="status-btn rewatch-toggle{% if current_rewatch %} active-rewatch{% endif %}"
    hx-post="/films/{{ tmdb_id }}/status"
    hx-vals='{"rewatch": "{{ 0 if current_rewatch else 1 }}"}'
    hx-target="#status-control"
    hx-swap="outerHTML"
    title="Mark for rewatch">↩ Rewatch</button>
</div>

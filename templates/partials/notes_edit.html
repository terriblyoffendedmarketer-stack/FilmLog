<form
  hx-post="/films/{{ tmdb_id }}/notes"
  hx-target="#notes-section"
  hx-swap="innerHTML">

  <textarea
    name="personal_notes"
    class="notes-textarea"
    placeholder="What did you like about it? What makes it the right film for a specific mood? Any connections to other films?&#10;&#10;There's no wrong answer — the more honest, the sharper the recommendations get."
    autofocus>{{ notes or '' }}</textarea>

  <div class="notes-actions">
    <button type="submit" class="btn-primary">Save</button>
    <button type="button" class="btn-ghost"
      hx-get="/films/{{ tmdb_id }}/notes/view"
      hx-target="#notes-section"
      hx-swap="innerHTML">Cancel</button>
  </div>

</form>

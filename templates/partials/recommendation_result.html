{% if error %}
<div class="rec-result-error">
  <p>{{ error }}</p>
</div>

{% elif issue %}
<div class="fresh-issue-wrapper" id="fresh-issue">
  {% include "partials/magazine_issue.html" %}

  <div class="rec-result-actions" style="margin-top:28px; text-align:center;">
    <button type="button" class="btn-ghost" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">↑ Ask for another vibe</button>
  </div>
</div>
{% endif %}
